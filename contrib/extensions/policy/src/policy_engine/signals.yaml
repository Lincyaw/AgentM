# Signal definitions: each signal is a SQL query over the PG data plane.
#
#   query      SQL over policy.* views/tables; TRUE when any row returns.
#              Use %(session_id)s for session scoping (auto-bound).
#              Use %(param_name)s for named params from the `params` block.
#   evidence   optional query + format for inject-tier evidence messages.
#   provenance where the rule came from / how it was calibrated.

signals:
  always:
    query: "SELECT 1"
    provenance: unconditional gate for critic items with no cheap precondition

  # -- Coverage (requires repository symbol index) ----------------------------

  dependency_blind_spot:
    query: >-
      SELECT d.defining_path, d.referencing_path
      FROM policy.v_file_deps d
      JOIN policy.v_mutations m
        ON m.session_id = d.session_id AND m.path = d.defining_path
      WHERE d.session_id = %(session_id)s
        AND NOT EXISTS (
          SELECT 1 FROM policy.v_regions r
          WHERE r.session_id = d.session_id
            AND r.path = d.referencing_path
        )
      LIMIT 1
    evidence:
      query: >-
        SELECT d.defining_path, d.referencing_path, d.symbol_name
        FROM policy.v_file_deps d
        JOIN policy.v_mutations m
          ON m.session_id = d.session_id AND m.path = d.defining_path
        WHERE d.session_id = %(session_id)s
          AND NOT EXISTS (
            SELECT 1 FROM policy.v_regions r
            WHERE r.session_id = d.session_id
              AND r.path = d.referencing_path
          )
        LIMIT 5
      format: "edited {0}, downstream consumer {1} (via {2}) never read"
    provenance: >-
      failure pattern 1; degrades to silent when file_symbols is empty.

  definition_not_traced:
    query: >-
      SELECT d.referencing_path, d.defining_path
      FROM policy.v_file_deps d
      JOIN policy.v_regions r
        ON r.session_id = d.session_id AND r.path = d.referencing_path
      WHERE d.session_id = %(session_id)s
        AND NOT EXISTS (
          SELECT 1 FROM policy.v_reads rd
          WHERE rd.session_id = d.session_id
            AND rd.path = d.defining_path
        )
      LIMIT 1
    evidence:
      query: >-
        SELECT DISTINCT d.referencing_path, d.defining_path, d.symbol_name
        FROM policy.v_file_deps d
        JOIN policy.v_regions r
          ON r.session_id = d.session_id AND r.path = d.referencing_path
        WHERE d.session_id = %(session_id)s
          AND NOT EXISTS (
            SELECT 1 FROM policy.v_reads rd
            WHERE rd.session_id = d.session_id
              AND rd.path = d.defining_path
          )
        LIMIT 5
      format: "{0} uses symbol {2} defined in {1}, but {1} was never read"
    provenance: >-
      failure pattern 5; degrades to silent when file_symbols is empty.

  # -- Dynamics ---------------------------------------------------------------

  non_convergent:
    query: >-
      WITH bounds AS (
        SELECT MIN(turn_index) AS lo, MAX(turn_index) AS hi
        FROM policy.v_regions WHERE session_id = %(session_id)s
      ),
      first_seen AS (
        SELECT r.path,
          CASE WHEN MIN(r.turn_index) >= b.lo + (b.hi - b.lo) * 0.5
               THEN 1 ELSE 0 END AS is_late
        FROM policy.v_regions r, bounds b
        WHERE r.session_id = %(session_id)s
        GROUP BY r.path, b.lo, b.hi
      )
      SELECT 1
      WHERE (SELECT COUNT(*) FROM first_seen WHERE is_late = 1)
            > (SELECT COUNT(*) FROM first_seen WHERE is_late = 0) * %(late_ratio)s
        AND (SELECT COUNT(*) FROM first_seen) >= %(min_files)s
    params: { late_ratio: 0.3, min_files: 8 }
    evidence:
      query: >-
        WITH bounds AS (
          SELECT MIN(turn_index) AS lo, MAX(turn_index) AS hi
          FROM policy.v_regions WHERE session_id = %(session_id)s
        ),
        first_seen AS (
          SELECT r.path,
            CASE WHEN MIN(r.turn_index) >= b.lo + (b.hi - b.lo) * 0.5
                 THEN 1 ELSE 0 END AS is_late
          FROM policy.v_regions r, bounds b
          WHERE r.session_id = %(session_id)s
          GROUP BY r.path, b.lo, b.hi
        )
        SELECT
          (SELECT COUNT(*) FROM first_seen WHERE is_late = 0),
          (SELECT COUNT(*) FROM first_seen WHERE is_late = 1)
      format: "{0} files appeared in first half, {1} new files in second half"
    provenance: >-
      convergence signal; agent's file frontier should narrow over time.
      Fires when >30% of touched files first appear in the second half.
      Validated on harbor_live corpus: 4/20 fail, 1/9 pass sessions.
