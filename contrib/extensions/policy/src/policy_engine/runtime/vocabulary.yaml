agent_has_edited:
  definition: The agent has made at least one edit to the codebase.
artifact_reference:
  definition: The agent's earlier turns quote or summarize content from repository
    or reference artifacts.
baseline_comparison_attempt:
  definition: The agent attempts to compare its results to a baseline, such as by
    running a baseline or referencing baseline performance.
change_affects_external_consumers:
  definition: The agent has explored call chains and determined that the code it changed
    is used by consumers (callers) that reside outside the set of files that were
    edited.
cites_tests_as_evidence:
  definition: The agent's verification or final summary explicitly references test
    results as evidence of completion or correctness.
completion_claim:
  definition: The agent stops with a completion, done, or merge-readiness claim
diff_touches_named_area:
  definition: The agent's diff includes changes to the specific named hotspot or scenario
    that the task targets.
enumeration_claim:
  definition: The agent's stop-time claim enumerates implemented behaviors or features.
external_changes_detected:
  definition: Evidence of modifications in the workspace that were not made by the
    agent, such as from a workspace status or diff.
failure_unrelated_claim:
  definition: The agent asserts in messages or final summary that a validation failure
    pre-dates its changes or is unrelated to them.
final_diff_present:
  definition: The trajectory contains a final diff output (e.g., a git diff or similar
    change summary).
mechanism_cause_commitment:
  definition: The agent's edit rationales or planning text indicate a commitment to
    a mechanism-level cause (e.g., a specific root cause or underlying mechanism for
    a behavior).
multiple_cases_change:
  definition: The change introduces multiple code paths or input case-classes.
narrow_change_set:
  definition: The agent's final summary enumerates a narrow set of changed files.
performance_or_quantitative_context:
  definition: The task is described as an optimization or performance task, or the
    agent's final summary includes quantitative or effect language about the change's
    impact.
persistent_state_lifetime_commitment:
  definition: The diff adds new fields or keys to a persistent state structure, and
    there is an assertion (from task, reference, or agent claim) that this state is
    tracked, preserved, or produced across events/consumers/restarts, or its lifetime
    is bounded.
pre_existing_test_failure:
  definition: A validation failure occurs from a test that existed before the agent's
    edits (i.e., not authored by the agent).
pre_existing_test_pins_behavior:
  definition: There exists a pre-existing test (i.e., a test that existed before the
    agent's edits) that specifically tests the behavior that is the subject of the
    agent's change.
recurring_validation_failure:
  definition: The same validation failure (same named test or check) occurs in at
    least two separate runs, and the most recent full-scope result of that validation
    is still a failure.
repeated_action_failure:
  definition: The agent performs the same type of action (e.g., editing, running a
    command) on the same artifact at least twice, and each action is followed by a
    failure of the same class (e.g., same validation error).
retry_on_adverse_result:
  definition: The diff introduces a branch that re-attempts an operation in response
    to an adverse result.
symptom_repetition_wording:
  definition: The task symptom text includes words or phrases indicating repetition
    or persistence across instances (e.g., 'again', 'over and over', 'never recover',
    'restarting clears it for a while', 'keeps making requests').
task_enumeration_definition:
  definition: The task description defines required behavior by enumerating specific
    behaviors, scenarios, or cases (e.g., a reference implementation to match, listed
    scenarios, or a symptom with named cases).
task_lacks_clear_acceptance:
  definition: The task description does not include a specific acceptance criterion
    that determines the correct outcome or approach; it only describes a symptom or
    goal without such a criterion.
task_requires_reference_parity:
  definition: The task description explicitly requires matching or parity with a named
    reference implementation.
task_targets_named_hotspot_or_scenario:
  definition: The task description identifies a specific named hotspot (e.g., a function,
    module, or code location) or a named scenario (e.g., a use case) for optimization
    or performance improvement.
test_commands_narrowed:
  definition: All executed test commands in the trajectory include selectors that
    narrow the test scope (e.g., specific test names, patterns, or directories).
test_file_edited:
  definition: The agent has made edits to test files (e.g., files with test-related
    names or located in test directories).
validation_failure:
  definition: Any validation command in the trajectory exits with a non-zero exit
    code
validation_tests_agent_only:
  definition: The validation list (e.g., tests run) contains only tests that the agent
    authored or edited in this session.
varying_validation_failures:
  definition: The set of failing tests in a validation run differs from the set in
    a previous run of the same validation command.
