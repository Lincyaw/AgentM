# What the engine does by default, which is one thing.
#
# The forty-two mined items are still here, in mined-checklist.yaml, and are
# loaded by pointing `checklist` at them. They are not the default any more
# because they have not earned it: across twenty-one measured replays they
# moved no graded score, while costing a tagger call every five turns and the
# whole vocabulary/compile apparatus that exists to gate them.
#
# What is left is the one gate with evidence behind it. In the single measured
# run whose score did move, the deciding edit was turn 57 of 116 -- the agent
# moving a lock it had itself written six turns earlier -- and what changed its
# mind was an error from something it ran, not a sentence it was sent. That is
# what `deliver: review` buys and an injected check cannot.
#
# The gate is free to evaluate: `reworked_own_work` is computed from the tool
# stream, so this default costs nothing until it fires.

items:
- id: rework_review
  dimension: design_revision
  # Read by the acceptance reviewer at submit, as a concern this run raised.
  # The critic that actually runs is not given this text -- it is asked to
  # break the rework and gets the run, not a rubric.
  check: The agent rebuilt something it had already built, so its first shape
    was wrong. Whether the second one survives a case it was not designed for
    was checked at the time.
  advice: ''
  deliver: review
  # Measured at four to six firings a run before the budget bites. Three is
  # what a run can afford when each one blocks the agent for a full review.
  max_fires: 3
  when:
    checkpoint: continuous
    trigger: reworked_own_work
