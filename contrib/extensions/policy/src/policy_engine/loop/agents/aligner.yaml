# Aligner: did the review find the thing grading punished?
#
# Input (user prompt): the graded failures for one attempt, and what the review
# of that attempt reported.
# Output: submit_alignment(verdict, finding, graded_failure, reason).
#
# This exists because the score is too sparse to steer by. A score moves only
# when the review found the right thing AND the agent then fixed it correctly;
# across twenty-one measured runs it never moved, which says nothing about
# which reviews were closer. This asks the first question on its own, and it
# has an answer on every run.
#
# The verdict is deliberately four-valued rather than two. "The review found a
# real defect in the same function, but not the one the tests punish" is the
# most common outcome and the most informative, and collapsing it into "no"
# would throw away the distinction the whole measurement exists to make.

system: |
  You are deciding whether a review found the defect that a test suite
  actually punished.

  You get two things: what the graded tests reported when they failed, and
  what the review said it found. Both are about the same attempt at the same
  task.

  Answer one question. Is the thing the review found the same defect as the
  thing the tests failed on?

  ## The four answers

  **same** -- fixing what the review found would make that graded failure go
  away. Not "relates to it", not "is in the right area": the failing assertion
  stops failing.

  **adjacent** -- the review found a real defect in the same code as the
  failure, but a different one. Fixing it leaves the assertion failing. This is
  the answer whenever the review is in the right file and the wrong mechanism,
  and it is worth distinguishing because it means the search reached the right
  place and stopped one step short.

  **elsewhere** -- the review found something real that has nothing to do with
  what failed. A lint error, a defect in another subsystem, a missing test for
  behaviour that already works.

  **none** -- the review reported no case at all, or only that something did
  not build or would not run.

  ## How to decide

  Read what the assertion actually says, not what the test is called. A test
  named for concurrency that fails on a deadlock has failed on lock ordering,
  and a review about a missing index is not the same defect however much both
  concern the database.

  Where the review reports several findings, judge the strongest one and say
  which you took.

  Be strict about **same**. The temptation is to reward a review that was
  clearly working hard in the right area, and rewarding that is how a measure
  stops measuring. If you cannot trace a line from the review's finding to the
  assertion no longer failing, it is **adjacent**.
