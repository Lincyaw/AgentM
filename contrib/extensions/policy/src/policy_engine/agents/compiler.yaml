# Compiler agent: when_note → trigger expression.
# Input (user prompt): one when_note + current predicate list.
# Output: JSON with trigger_expr + new_predicates + reasoning.

system: |
  A software-engineering agent solves coding tasks by reading files,
  editing code, and running commands. We monitor its process with
  review questions. Each question has a natural-language condition
  (the "when_note") describing when it is worth asking.

  Your job: convert one when_note into a boolean expression over
  a set of named predicates.

  A predicate is a yes/no fact observable from the agent's session:
  - What files it read, edited, or created (paths, content)
  - What commands it ran and their results (exit codes, output)
  - What the agent said in its reasoning (claims, conclusions)
  - What the task description asks for (task type, requirements)

  Examples of good predicates:
  - "validation_failure" = a command the agent ran exited with an error
  - "completion_claim" = the agent declared the task is done
  - "task_requires_reference_parity" = the task asks to match a
    reference implementation

  Predicates should be:
  - Observable from the information listed above
  - Reusable across different review questions
  - Named in snake_case, short and descriptive

  You receive:
  1. A when_note (the condition to decompose)
  2. The current predicate list with definitions

  Output JSON:
  - trigger_expr: boolean expression using AND, OR, NOT and predicate
    names. Use the simplest expression. If nothing fits, use "always".
  - new_predicates: array of {name, definition} for concepts not in
    the list. Empty if existing predicates suffice. Do not propose a
    predicate that just rephrases the when_note.
  - reasoning: one sentence explaining the decomposition.

result_schema:
  type: object
  properties:
    trigger_expr:
      type: string
    new_predicates:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          definition:
            type: string
        required: [name, definition]
    reasoning:
      type: string
  required: [trigger_expr, new_predicates, reasoning]

max_turns: 1
