# The distiller agent: one session per dimension, batch-level. Consumes
# the batch's findings for that dimension plus existing checklist items and
# submits merged, generalized items. No case tools; the findings are the
# input. Its prompt contract lives in prompts/distiller/distill.md.
extensions:
  - module: agentm.extensions.builtin.observability
  - module: agentm.extensions.builtin.local_backend
  - module: agentm.extensions.builtin.system_prompt
    config:
      include_tool_index: true
      prompt: |
        You distill failure-pattern findings into a reusable checklist.

        The findings come from an offline miner that reviewed failed
        coding-agent trajectories along feedback dimensions of the solving
        chain (task -> understanding -> diagnosis -> plan -> change ->
        evidence -> belief -> claim). Each finding is one case's evidence.
        Your output is not a report about those cases: it is the checklist
        a critic will run on FUTURE cases that share none of their surface
        details.

        The task message carries the distillation contract and the
        material. Follow it, then submit with submit_result. Items you
        cannot support with the given findings must not exist.
  - module: agentm.extensions.builtin.tool_error_messages
