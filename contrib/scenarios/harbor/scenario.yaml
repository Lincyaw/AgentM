name: arl:harbor
description: |
  AgentM as Harbor external agent.
  Agent runs locally; tool calls route through Harbor's BaseEnvironment.

includes:
  - base.yaml

extensions:
  - module: agentm_harbor.compaction
  - module: agentm.extensions.builtin.llm_compaction
    config:
      keep_last_turns: 4
  - module: agentm.extensions.builtin.read_history
    config:
      tool_result_max_tokens: 200
      total_max_tokens: 1000
  - module: agentm.extensions.builtin.skill_loader
  # Not a tool for running agents. An agent given one of those writes a brief
  # for a subordinate: it appends instructions, grants permissions the reviewer
  # does not have, and states what the correct output would be -- which the
  # reviewer then verifies the change against, closing the loop it was spawned
  # to open. A form has no place to put any of that.
  #
  # The review runs in this same sandbox, because the point is a reader that can
  # run the thing it doubts, not a second opinion about the diff.
  - module: agentm_harbor.review_request
    config:
      scenario: "arl:harbor-critic"
      # Local knowledge reaches the reviewer per repository, from a
      # review-notes.md beside the task, named through this variable. What is
      # true of a database is noise to a syntax highlighter, and one blob for
      # both would be too vague to act on either way.
      notes_env: "AGENTM_REVIEW_NOTES"

  - module: agentm.extensions.builtin.tool_policy
    config:
      protect_file_mutations: true
  # Records every tool event to the per-session policy DB; checklist
  # triggers + interventions stay disabled unless the run sets
  # AGENTM_CHECKLIST_WATCH_ENABLED=true (baseline batches stay clean).
  - module: policy_engine
    config:
      trajectory_dsn: "postgresql://agentm:agentm@localhost:55432/agentm_test"
      critic: "on"
      critic_provider: "azure-gpt"
      max_injections: 5
  - module: agentm.extensions.builtin.tool_purpose
