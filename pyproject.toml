[project]
name = "agentm"
version = "0.2.7"
description = "AgentM SDK"
readme = "README.md"
authors = [{ name = "Aoyang Fang", email = "aoyangfang@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-frontmatter>=1.3.0",
    "textual[syntax]>=2.0",
    "sqlalchemy>=2.0",
    "ast-grep-cli>=0.44.1",
    # What the atoms this package ships actually import. They were extras, and
    # each one bought a deferred `ImportError` in place of a resolution-time
    # failure -- which is strictly worse: `pip install agentm` succeeded and the
    # first model call died, or worse, `_is_openai_retryable` caught the
    # ImportError and quietly answered "not retryable", so retries stopped
    # existing instead of anything failing. If we ship the atom, we depend on
    # what the atom imports.
    "httpx>=0.28.0",
    "openai>=1.50.0",
    "anthropic>=0.86.0",
    "tiktoken>=0.12.0",
    "jsonschema>=4.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
]

[project.optional-dependencies]
# Only backends a deployment opts into, by writing a DSN or naming a scenario.
# Nothing here is reached unless something in the configuration asks for it, so
# an absent one cannot turn into a surprise at runtime the way an absent
# provider SDK did.
storage-postgres = [
    "psycopg[binary]>=3.2.0",
]
storage-clickhouse = [
    "clickhouse-connect>=0.7.0",
]

[dependency-groups]
dev = [
    # The suite sweeps every shipped atom and exercises every backend, so the
    # dev environment installs the opt-in ones too. Without this, `uv sync`
    # produces a venv the tests cannot run in, and the failures look like real
    # ones: a builtin that cannot import fails that atom's case rather than
    # erroring the run.
    "agentm[storage-postgres,storage-clickhouse]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.scripts]
agentm = "agentm.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Both top-level packages under src/ ship in the wheel. The backend would
# otherwise infer a single module from the project name and silently leave
# `agentm_toolbox` out, so an installed `agentm` imports fine until the first
# file or bash tool call and then dies on ModuleNotFoundError. The toolbox stays
# top-level rather than nesting under `agentm` because it is uploaded as a bare
# directory into remote sandboxes and run there as `python -m agentm_toolbox`,
# with no agentm on the path.
module-name = ["agentm", "agentm_toolbox"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that may run for many minutes (real-LLM E2E)",
    "requires_api_key: tests that hit a real LLM provider; skipped without env",
]
testpaths = ["tests"]
addopts = ""
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "runs", "jobs"]

[tool.ruff.lint]
# The E/F core plus high-signal correctness guards:
#   S110 — try/except/pass
#   S112 — try/except/continue
#   B007 — unused loop control variables
#   B905 — zip calls whose truncation policy is implicit
#   RUF006 — asyncio tasks created without retaining a reference
# Every caught exception must at least be logged or surfaced, never dropped on
# the floor. A handler that genuinely needs to swallow must log (debug for
# expected/benign, warning+ for error-hiding) — see the silent-exception
# discipline applied across src/agentm. Suppress with an explicit
# ``# noqa: S110`` + reason only when logging is truly impossible.
#
# Stated as an explicit ``select`` rather than ``extend-select``: the baseline
# ruff calls "default" is not stable across releases, and 0.16 widened it. The
# list below is the rule set this project actually enforces, so a ruff upgrade
# changes the tree only when we change this line.
#
# Deliberately not enforced, because each conflicts with a chosen discipline:
#   BLE001 — broad ``except`` is fine here when it logs or surfaces, which is
#            what AM001 in agentm.code_health already checks; S110/S112 above
#            catch the silent cases, which are the ones that actually hurt.
#   TRY004 — storage and wire decoders raise ValueError for malformed persisted
#            data, and callers catch ValueError. TypeError is for a caller
#            passing the wrong type, which is not what these guards detect.
#   B008   — typer expresses CLI options as call-valued defaults; there is no
#            other way to write a typer command.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B007",
    "B905",
    "RUF006",
    "S110",
    "S112",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlmodel", "sqlmodel.*"]
ignore_missing_imports = true
